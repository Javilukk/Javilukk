<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="300" viewBox="0 0 1000 300"
     role="img" aria-labelledby="title desc">
  <title id="title">TU NOMBRE — perfil de GitHub</title>
  <desc id="desc">Banner oscuro con un mosaico de píxeles verdes.</desc>

  <defs>
    <!-- COLORES: cambia estos valores para personalizar el mosaico. -->
    <pattern id="pixels" width="140" height="100"
             patternUnits="userSpaceOnUse">
      <rect width="140" height="100" fill="#17251c"/>
      <g fill="#294b32">
        <path d="M0 0h20v20H0z M40 20h20v20H40z
                 M80 0h20v20H80z M120 40h20v20H120z
                 M20 60h20v20H20z M60 80h20v20H60z"/>
      </g>
      <g fill="#4a8650">
        <path d="M20 0h20v20H20z M60 20h20v20H60z
                 M100 40h20v20H100z M0 80h20v20H0z
                 M80 60h20v20H80z"/>
      </g>
      <g fill="#9bc76b">
        <path d="M100 0h20v20H100z M20 40h20v20H20z
                 M60 60h20v20H60z M120 80h20v20H120z"/>
      </g>
      <path d="M40 0h20v20H40z M100 80h20v20H100z"
            fill="#d2d99a"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="8" fill="#252624"/>
  <rect x="1" y="1" width="998" height="298" rx="8"
        fill="none" stroke="#3b4238"/>

  <!-- EDITA: nombre principal. -->
  <text x="32" y="61" fill="#f0eee6"
        font-family="monospace" font-size="36"
        letter-spacing="3">TU NOMBRE</text>

  <text x="34" y="89" fill="#9da892"
        font-family="monospace" font-size="12"
        letter-spacing="3">APRENDER / CONSTRUIR / COMPARTIR</text>

  <rect x="0" y="112" width="1000" height="126"
        fill="url(#pixels)"/>
  <rect x="650" y="112" width="350" height="126"
        fill="#252624"/>

  <g fill="#d8d4c8">
    <path d="M725 132h20v20h-20v20h-20v20h20v20h20v20h-20
             v-20h-20v-20h-20v-20h20v-20h20z"/>
    <path d="M875 132h-20v20h20v20h20v20h-20v20h-20v20h20
             v-20h20v-20h20v-20h-20v-20h-20z"/>
  </g>
  <path d="M815 132h20l-40 100h-20z" fill="#9bc76b"/>
  <g fill="#4a8650">
    <rect x="665" y="128" width="20" height="20"/>
    <rect x="935" y="168" width="20" height="20"/>
    <rect x="955" y="208" width="20" height="20"/>
  </g>
  <rect x="935" y="128" width="20" height="20" fill="#d2d99a"/>

  <!-- EDITA: especialidad o puesto. -->
  <text x="968" y="276" text-anchor="end" fill="#f0eee6"
        font-family="monospace" font-size="18"
        letter-spacing="2">DESARROLLO · DATOS · IA</text>
</svg>